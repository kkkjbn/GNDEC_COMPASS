name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check src/worker.js
          node --check public/assets/js/logic.js
          node --check public/assets/js/components.js
          node --check public/assets/js/store.js
      - name: Data integrity
        run: npm run check
      - name: Unit tests
        run: npm test
